[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-emotion-recognition"
version = "0.1.0"
description = "A reproducible and lightweight pipeline for subject-independent ECG emotion recognition."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Microverdant" }
]
keywords = ["ECG", "emotion-recognition", "signal-processing", "machine-learning", "healthcare-ai"]
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2",
    "scipy>=1.10"
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.2"
]
demo = [
    "streamlit>=1.30"
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5"
]

[project.scripts]
ecg-emotion = "ecg_emotion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

